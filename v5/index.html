<script type="module">
import { FilesetResolver, HandLandmarker, FaceLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
// ===================== 柿ピーシャワー v4 =====================
// ルールは1つ：柿の種を食べると柿ピーが降る。18秒でどれだけ埋められるか。
const q=new URLSearchParams(location.search); const DEMO=q.get('demo');
const $=id=>document.getElementById(id);
const cv=$('c'), ctx=cv.getContext('2d'), hc=$('heap'), hctx=hc.getContext('2d'); let W=0,H=0;
function fit(){ const dpr=Math.min(2,devicePixelRatio||1); W=cv.width=hc.width=innerWidth*dpr; H=cv.height=hc.height=innerHeight*dpr; } fit(); addEventListener('resize',fit);
// ---- sprites（sheet.json があればそれを、無ければ k*/p* を使う）----
const SPR={K:[],P:[]};
const SPR_READY=(async()=>{ let list=null; try{ list=await (await fetch('sprites/sheet.json?v='+Date.now())).json(); }catch(e){}
  const files=list||{K:[0,1,2,3,4,5].map(i=>`k${i}.png`),P:[0,1,2,3,4,5].map(i=>`p${i}.png`)}; const ps=[];
  for(const k of ['K','P']) for(const f of files[k]){ const im=new Image(); im.src='sprites/'+f+'?v=5'; SPR[k].push(im); ps.push(im.decode().catch(()=>{})); }
  await Promise.all(ps); SPR.K=SPR.K.filter(i=>i.naturalWidth); SPR.P=SPR.P.filter(i=>i.naturalWidth); console.log('sprites',SPR.K.length,SPR.P.length); })();
const S={run:false,t0:0,left:18,active:[],landed:0,landedK:0,landedP:0,bites:0,combo:0,lastBite:0,fillLine:0,done:false,lastScore:0};
(function clock(){ const d=new Date(); $('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); setTimeout(clock,15000); })();
function updBar(){ const t=S.landedK+S.landedP; const r=t?S.landedK/t:0.7; $('fill').style.width=(r*100).toFixed(1)+'%'; }
const DUR=18000, FULL=560; const rnd=(a,b)=>a+Math.random()*(b-a);
const L=()=>W*0.14;
function spawn(kind,n){ for(let i=0;i<n;i++){ const arr=SPR[kind]; if(!arr.length) continue; S.active.push({k:kind,s:arr[Math.floor(Math.random()*arr.length)],x:rnd(0.03,0.97)*W,y:-rnd(0.05,1.1)*H,vy:rnd(1.1,2.0),vx:rnd(-0.1,0.1),r:rnd(-Math.PI,Math.PI),vr:rnd(-0.05,0.05),sc:rnd(0.8,1.25),blur:1}); } }
function bite(){ const now=performance.now(); if(now-S.lastBite<450) return; S.combo=(now-S.lastBite<3000)?S.combo+1:1; S.lastBite=now; S.bites++;
  const n=Math.min(84, 34+S.combo*8); spawn('K',Math.round(n*0.7)); spawn('P',Math.round(n*0.3)); flash(S.combo>=3?`×${S.combo}`:'カリッ'); SFX.crunch(); }
function flash(s){ const d=$('det'); d.textContent=s; d.classList.remove('on'); void d.offsetWidth; d.classList.add('on'); }
function drawSprite(g,p,trail){ const im=p.s; if(!im||!im.naturalWidth) return false; const Lp=L()*p.sc; const big=Math.max(im.naturalWidth,im.naturalHeight); const k=(p.k==='K'?1:0.66)*Lp/big; const w=im.naturalWidth*k, h=im.naturalHeight*k;
  g.save(); g.translate(p.x,p.y); g.rotate(p.r);
  if(trail&&p.vy>1.2){ g.globalAlpha=0.28; g.drawImage(im,-w/2,-h/2-p.vy*Lp*0.10,w,h); g.globalAlpha=0.55; g.drawImage(im,-w/2,-h/2-p.vy*Lp*0.05,w,h); g.globalAlpha=1; }
  g.shadowColor='rgba(0,0,0,.4)'; g.shadowBlur=Lp*0.10; g.shadowOffsetY=Lp*0.05; g.drawImage(im,-w/2,-h/2,w,h); g.restore(); return true; }
function drawOnce(){ window.__f=(window.__f||0)+1; ctx.clearRect(0,0,W,H); const Lp=L(); S.fillLine=H-Math.min(H*0.985,(S.landed/FULL)*H*0.985);
  const keep=[]; let landedNow=0;
  for(const p of S.active){ p.vy+=0.06; p.y+=p.vy*Lp*0.11; p.x+=p.vx*Lp*0.05; p.r+=p.vr; const line=S.fillLine-rnd(0,Lp*0.9);
    if(p.y>=line){ p.y=Math.min(H+Lp*0.3,line+rnd(-Lp*0.15,Lp*0.45)); p.r+= rnd(-0.3,0.3); p.sc*=1.06; if(drawSprite(hctx,p,false)){ S.landed++; landedNow++; if(p.k==='K')S.landedK++; else S.landedP++; } else keep.push(p); }
    else { drawSprite(ctx,p,true); keep.push(p); } }
  S.active=keep; if(landedNow>0){ SFX.land(landedNow); updBar(); }
  
  if(S.run){ const el=performance.now()-S.t0; S.left=Math.max(0,(DUR-el)/1000); $('tn').textContent=S.left<10?S.left.toFixed(1):Math.ceil(S.left); $('arc').setAttribute('stroke-dashoffset',String(597*(1-S.left/18))); if(el>=DUR&&S.active.length===0) finish(); else if(el>=DUR+4000) finish(); }
}
function draw(){ drawOnce(); requestAnimationFrame(draw); }
window.__adv=(n)=>{ for(let i=0;i<n;i++) drawOnce(); };
function finish(){ if(S.done)return; S.done=true; S.run=false; const fill=Math.min(1,S.landed/FULL); const t=S.landedK+S.landedP; const r=t?S.landedK/t:0.7; const match=Math.max(0,1-Math.abs(r-0.7)/0.7); const score=Math.round(fill*100*match); $('r1').textContent=Math.round(fill*100)+'%'; $('r2').textContent=(r*10).toFixed(1)+':'+((1-r)*10).toFixed(1); $('r3').textContent=Math.round(match*100)+'%'; $('r4').textContent=score; $('r5').textContent=`${Math.round(fill*100)}% × ${Math.round(match*100)}% = ${score}`; S.lastScore=score; SFX.result(); BGM.stop(); $('res').classList.add('on'); }
function startGame(){ S.active=[];S.landed=0;S.landedK=0;S.landedP=0;S.bites=0;S.combo=0;S.lastBite=0;S.run=true;S.done=false;S.t0=performance.now(); hctx.clearRect(0,0,W,H); updBar(); $('start').classList.remove('on'); $('res').classList.remove('on'); BGM.start(); $('status').textContent='柿の種を口元へ。カリッ。'; }
$('again').onclick=()=>{ $('res').classList.remove('on'); startGame(); };
addEventListener('keydown',e=>{ if(!S.run)return; if(e.key===' '||e.key==='k'||e.key==='K'||e.key==='p'||e.key==='P') bite(); });
$('c').addEventListener('pointerdown',()=>{ if(S.run&&(DEMO||q.get('tap'))) bite(); });
$('share').onclick=async()=>{ const sc=$('shot'); sc.width=W; sc.height=H; const g=sc.getContext('2d'); const src=DEMO?$('still'):$('cam'); g.save(); if(!DEMO){g.translate(W,0);g.scale(-1,1);} try{ const vw=src.videoWidth||src.naturalWidth, vh=src.videoHeight||src.naturalHeight; const s=Math.max(W/vw,H/vh); g.drawImage(src,(W-vw*s)/2,(H-vh*s)/2,vw*s,vh*s);}catch(e){} g.restore(); g.drawImage(hc,0,0); g.drawImage(cv,0,0); g.fillStyle='rgba(0,0,0,.28)'; g.fillRect(0,0,W,H); g.fillStyle='#FF9900'; g.textAlign='center'; g.font=`900 ${W*0.34}px Hiragino Sans, sans-serif`; g.fillText(String(S.lastScore),W/2,H*0.5); g.fillStyle='#fff'; g.font=`700 ${W*0.05}px Hiragino Sans, sans-serif`; g.fillText('#柿ピーシャワー',W/2,H*0.58);
  sc.toBlob(async b=>{ const f=new File([b],'kakipea.png',{type:'image/png'}); if(navigator.canShare&&navigator.canShare({files:[f]})){ try{await navigator.share({files:[f],text:'#柿ピーシャワー'});}catch(e){} } else { const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='kakipea.png'; a.click(); } }); };
// ===================== 音（Web Audioで合成：外部音源なし）=====================
let AC=null, master=null, muted=false;
function audio(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=0.9; master.connect(AC.destination); } if(AC.state==='suspended') AC.resume(); return AC; }
$('mute').onclick=()=>{ muted=!muted; $('mute').textContent=muted?'✕':'♪'; if(master) master.gain.value=muted?0:0.9; };
const SFX={ crunch(){ try{ const ac=audio(); const t=ac.currentTime; const n=ac.createBufferSource(); const len=Math.floor(ac.sampleRate*0.16); const buf=ac.createBuffer(1,len,ac.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<len;i++){ const e=Math.exp(-i/(len*0.18)); d[i]=(Math.random()*2-1)*e*(i<len*0.05?1.4:1); } n.buffer=buf; const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2600; f.Q.value=0.7; const g=ac.createGain(); g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.18); n.connect(f); f.connect(g); g.connect(master); n.start(t);
    const o=ac.createOscillator(); o.type='square'; o.frequency.setValueAtTime(1400,t); o.frequency.exponentialRampToValueAtTime(600,t+0.06); const og=ac.createGain(); og.gain.setValueAtTime(0.12,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.07); o.connect(og); og.connect(master); o.start(t); o.stop(t+0.08); }catch(e){} },
  _lt:0, land(n){ try{ const ac=audio(); const t=ac.currentTime; if(t-this._lt<0.05) return; this._lt=t; const cnt=Math.min(6,n); for(let i=0;i<cnt;i++){ const o=ac.createOscillator(); o.type='triangle'; o.frequency.value=rnd(1800,3200); const g=ac.createGain(); const tt=t+i*0.012; g.gain.setValueAtTime(0.05,tt); g.gain.exponentialRampToValueAtTime(0.001,tt+0.05); o.connect(g); g.connect(master); o.start(tt); o.stop(tt+0.06);} }catch(e){} },
  result(){ try{ const ac=audio(); const t=ac.currentTime; [523,659,784,1047].forEach((f,i)=>{ const o=ac.createOscillator(); o.type='triangle'; o.frequency.value=f; const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t+i*0.12); g.gain.exponentialRampToValueAtTime(0.35,t+i*0.12+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+i*0.12+0.6); o.connect(g); g.connect(master); o.start(t+i*0.12); o.stop(t+i*0.12+0.7); }); }catch(e){} } };
// BGM：128BPM・8小節ループのシンセポップ（キック／スネア／ハット／ベース／アルペジオ）
const BGM={ timer:null, on:false,
  start(){ try{ const ac=audio(); this.on=true; const bpm=128, beat=60/bpm, bar=beat*4; const chords=[[0,4,7],[5,9,12],[7,11,14],[9,12,16]]; // C F G Am
    const root=261.63; const nf=n=>root*Math.pow(2,n/12); let barI=0; let next=ac.currentTime+0.05;
    const kick=(t)=>{ const o=ac.createOscillator(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12); const g=ac.createGain(); g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.25); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.3); };
    const snare=(t)=>{ const n=ac.createBufferSource(); const len=Math.floor(ac.sampleRate*0.15); const b=ac.createBuffer(1,len,ac.sampleRate); const d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(len*0.25)); n.buffer=b; const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=1800; const g=ac.createGain(); g.gain.value=0.35; n.connect(f); f.connect(g); g.connect(master); n.start(t); };
    const hat=(t,a)=>{ const n=ac.createBufferSource(); const len=Math.floor(ac.sampleRate*0.04); const b=ac.createBuffer(1,len,ac.sampleRate); const d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(len*0.3)); n.buffer=b; const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000; const g=ac.createGain(); g.gain.value=a; n.connect(f); f.connect(g); g.connect(master); n.start(t); };
    const bass=(t,f,d)=>{ const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=f/2; const fl=ac.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=600; const g=ac.createGain(); g.gain.setValueAtTime(0.22,t); g.gain.exponentialRampToValueAtTime(0.001,t+d); o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t+d); };
    const pluck=(t,f,d,a)=>{ const o=ac.createOscillator(); o.type='square'; o.frequency.value=f; const fl=ac.createBiquadFilter(); fl.type='lowpass'; fl.frequency.setValueAtTime(3200,t); fl.frequency.exponentialRampToValueAtTime(700,t+d); const g=ac.createGain(); g.gain.setValueAtTime(a,t); g.gain.exponentialRampToValueAtTime(0.001,t+d); o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t+d); };
    const schedBar=(t,bi)=>{ const ch=chords[bi%4]; for(let b=0;b<4;b++){ const tb=t+b*beat; kick(tb); if(b%2===1) snare(tb); hat(tb,0.12); hat(tb+beat/2,0.07); bass(tb,nf(ch[0]-12),beat*0.9); if(b===2) bass(tb+beat/2,nf(ch[0]-12+7),beat*0.4);
        for(let s=0;s<4;s++){ const ts=tb+s*beat/4; const n=ch[(b+s)%3]+12; pluck(ts,nf(n),beat/4*0.9,0.09); } if(bi%2===1&&b===3) pluck(tb+beat/2,nf(ch[2]+24),beat/2,0.08); } };
    const tick=()=>{ if(!this.on) return; while(next<ac.currentTime+0.6){ schedBar(next,barI); barI++; next+=bar; } this.timer=setTimeout(tick,150); }; tick(); }catch(e){} },
  stop(){ this.on=false; clearTimeout(this.timer); } };
// ===================== 認識：口元に柿の種が来て、消えたら「食べた」 =====================
const DBG={on:!!q.get('debug'),pinch:null,mouth:null,orange:0,near:false};
let hand=null, face=null, ready=false;
async function loadModels(){ $('status').textContent='読み込み中…'; const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const H_URL="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", F_URL="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
  async function mk(cls,url,extra){ for(const d of ["GPU","CPU"]){ try{ return await cls.createFromOptions(fs,{baseOptions:{modelAssetPath:url,delegate:d},runningMode:"VIDEO",...extra}); }catch(e){ console.warn('delegate',d,'failed',e); } } throw new Error('model load failed'); }
  hand=await mk(HandLandmarker,H_URL,{numHands:1}); face=await mk(FaceLandmarker,F_URL,{numFaces:1}); ready=true; $('status').textContent=''; console.log('models ready'); }
const oc=document.createElement('canvas'), octx=oc.getContext('2d',{willReadFrequently:true}); oc.width=48; oc.height=48;
function orangeRatio(src,cx,cy,rad,vw,vh){ const x=Math.max(0,cx*vw-rad), y=Math.max(0,cy*vh-rad); octx.drawImage(src,x,y,rad*2,rad*2,0,0,48,48); const d=octx.getImageData(0,0,48,48).data; let n=0,o=0; for(let i=0;i<d.length;i+=4){ const r=d[i],g=d[i+1],b=d[i+2]; n++; const mx=Math.max(r,g,b), mn=Math.min(r,g,b); const s=mx?(mx-mn)/mx:0; let h=0; if(mx-mn>0){ if(mx===r)h=((g-b)/(mx-mn))%6; else if(mx===g)h=(b-r)/(mx-mn)+2; else h=(r-g)/(mx-mn)+4; h*=60; if(h<0)h+=360;} if(s>0.5&&h>=8&&h<=42&&mx>90) o++; } return o/n; }
const E={seen:0,armed:false,armedAt:0,gone:0,lastEat:0};
function step(src,vw,vh,ts){ if(!ready) return; let pinch=null,mouth=null,faceW=0.3,tipD=0;
  try{ const fr=face.detectForVideo(src,ts); if(fr.faceLandmarks&&fr.faceLandmarks[0]){ const Lm=fr.faceLandmarks[0]; mouth={x:(Lm[13].x+Lm[14].x)/2,y:(Lm[13].y+Lm[14].y)/2}; faceW=Math.hypot(Lm[454].x-Lm[234].x,Lm[454].y-Lm[234].y); } }catch(e){}
  try{ const hr=hand.detectForVideo(src,ts); if(hr.landmarks&&hr.landmarks[0]){ const Lh=hr.landmarks[0]; pinch={x:(Lh[4].x+Lh[8].x)/2,y:(Lh[4].y+Lh[8].y)/2}; tipD=Math.hypot(Lh[4].x-Lh[8].x,Lh[4].y-Lh[8].y); } }catch(e){}
  let o=0; if(pinch) o=orangeRatio(src,pinch.x,pinch.y,Math.max(vw*0.03,tipD*vw*0.9),vw,vh); else if(mouth) o=orangeRatio(src,mouth.x,mouth.y+faceW*0.12,vw*0.06,vw,vh);
  const near=!!(pinch&&mouth&&Math.hypot(pinch.x-mouth.x,pinch.y-mouth.y)<faceW*0.65) || (!pinch&&!!mouth);
  DBG.pinch=pinch;DBG.mouth=mouth;DBG.orange=o;DBG.near=near;
  if(o>0.08){ E.seen++; E.gone=0; if(E.seen>=2&&near){ E.armed=true; E.armedAt=performance.now(); } if(S.run) $('status').textContent='柿の種を認識。そのままカリッ。'; }
  else { E.gone++; if(E.armed&&E.gone>=3&&performance.now()-E.armedAt<2500){ E.armed=false; E.seen=0; bite(); } if(E.gone>6){ E.seen=0; if(E.gone>40) E.armed=false; } if(S.run&&E.gone>10) $('status').textContent='柿の種を口元へ。カリッ。'; }
}
// マイク：口元に柿の種があった直後の「カリッ」で即確定
async function mic(stream){ try{ const ac=audio(); const src=ac.createMediaStreamSource(stream); const an=ac.createAnalyser(); an.fftSize=1024; src.connect(an); const buf=new Float32Array(an.fftSize); let avg=0.01; (function tick(){ an.getFloatTimeDomainData(buf); let s=0; for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i]; const rms=Math.sqrt(s/buf.length); if(rms>avg*4.5&&rms>0.07&&E.armed&&performance.now()-E.armedAt<3000){ E.armed=false; bite(); } avg=avg*0.95+rms*0.05; requestAnimationFrame(tick); })(); }catch(e){} }
async function initCam(){ const v=$('cam'); const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:1280}},audio:true}); v.srcObject=st; await v.play(); mic(st); let last=-1;
  (function loop(){ if(v.readyState>=2&&v.currentTime!==last){ last=v.currentTime; step(v,v.videoWidth,v.videoHeight,performance.now()); } setTimeout(loop,66); })(); }
$('go').onclick=async()=>{ $('go').disabled=true; $('go').textContent='起動中…'; audio(); try{ await SPR_READY; if(!DEMO) await initCam(); await loadModels(); startGame(); }catch(e){ console.warn(e); $('status').textContent='カメラが使えません：画面タップ／スペースキーで「食べた」入力'; q.set('tap','1'); await loadModels().catch(()=>{}); startGame(); } };
window.__dbg=()=>({active:S.active.length,landed:S.landed,bites:S.bites,frames:window.__f,spr:[SPR.K.length,SPR.P.length]});
if(DEMO){ const im=$('still'); im.src=q.get('img')||''; im.style.display='block'; $('cam').style.display='none'; im.onload=async()=>{ await SPR_READY; if(!q.get('nomodel')){ await loadModels(); for(let i=0;i<4;i++){ step(im,im.naturalWidth,im.naturalHeight,performance.now()+i*70); await new Promise(r=>setTimeout(r,80)); } }
    if(q.get('auto')){ startGame(); BGM.stop(); S.t0=performance.now()-(parseFloat(q.get('at')||'8'))*1000; const nb=parseInt(q.get('bites')||'6'); for(let i=0;i<nb;i++){ S.lastBite=0; bite(); } } }; }
draw();
</script></body></html>
